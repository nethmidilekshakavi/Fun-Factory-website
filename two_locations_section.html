
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap');

  .find-us-badge {
    display: inline-block;
    border: 1.5px solid var(--color-border-secondary);
    border-radius: 999px;
    padding: 6px 22px;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    color: var(--color-text-secondary);
    margin-bottom: 18px;
  }

  .section-title {
    font-family: 'Nunito', sans-serif;
    font-size: 30px;
    font-weight: 900;
    color: var(--color-text-primary);
    margin: 0 0 28px;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .loc-card {
    border-radius: 20px;
    padding: 28px 24px 22px;
    position: relative;
    overflow: hidden;
    min-height: 220px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  .loc-card.pink-card {
    background: #F8D7DA;
    border: 2px solid #f0b8be;
  }

  .loc-card.yellow-card {
    background: #FFF3B0;
    border: 2px solid #f0d94a;
  }

  .card-emoji {
    position: absolute;
    top: 16px;
    right: 16px;
    font-size: 72px;
    line-height: 1;
    opacity: 0.92;
  }

  .card-name {
    font-family: 'Nunito', sans-serif;
    font-size: 17px;
    font-weight: 800;
    color: #2c2c2c;
    margin: 0 0 5px;
  }

  .card-address {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: #555;
    margin: 0 0 4px;
  }

  .card-phone {
    font-family: 'Poppins', sans-serif;
    font-size: 13px;
    color: #555;
    margin: 0 0 16px;
  }

  .call-btn {
    display: block;
    width: 100%;
    padding: 10px 0;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 800;
    text-align: center;
    cursor: pointer;
    border: none;
    letter-spacing: 0.3px;
  }

  .call-btn.pink-btn {
    background: #8B3A44;
    color: #fff;
  }

  .call-btn.yellow-btn {
    background: #F5C400;
    color: #3a2800;
  }

  .call-btn:hover {
    opacity: 0.9;
    transform: scale(0.98);
    transition: 0.15s;
  }
</style>

<h2 class="sr-only">Find Us — Two Locations</h2>

<div style="padding: 1.5rem 0;">
  <div class="find-us-badge">Find Us</div>
  <h2 class="section-title">Two Locations</h2>

  <div class="cards-grid">
    <div class="loc-card pink-card">
      <div class="card-emoji">🌍</div>
      <p class="card-name">Nawala Branch</p>
      <p class="card-address">573, Nawala Road, Rajagiriya</p>
      <p class="card-phone">011 286 2656 · 077 360 3777</p>
      <button class="call-btn pink-btn">Call Now</button>
    </div>

    <div class="loc-card yellow-card">
      <div class="card-emoji">📍</div>
      <p class="card-name">Mount Lavinia Branch</p>
      <p class="card-address">3rd Floor, Mount City Building, Galle Road</p>
      <p class="card-phone">011 588 2656 · 077 360 3777</p>
      <button class="call-btn yellow-btn">Call Now</button>
    </div>
  </div>
</div>

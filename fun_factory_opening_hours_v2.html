<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Two Locations</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: #f0f6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .container {
      max-width: 780px;
      width: 100%;
    }

    .find-us-badge {
      display: inline-block;
      border: 1.5px solid #ccc;
      border-radius: 999px;
      padding: 6px 22px;
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      color: #666;
      margin-bottom: 18px;
      background: #fff;
    }

    .section-title {
      font-family: 'Nunito', sans-serif;
      font-size: 34px;
      font-weight: 900;
      color: #1a1a1a;
      margin: 0 0 28px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .loc-card {
      border-radius: 20px;
      padding: 28px 24px 22px;
      position: relative;
      overflow: hidden;
      min-height: 230px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .loc-card.pink-card {
      background: #F8D7DA;
      border: 2px solid #f0b8be;
    }

    .loc-card.yellow-card {
      background: #FFF3B0;
      border: 2px solid #f0d94a;
    }

    .card-emoji {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 80px;
      line-height: 1;
      opacity: 0.92;
    }

    .card-name {
      font-family: 'Nunito', sans-serif;
      font-size: 18px;
      font-weight: 800;
      color: #2c2c2c;
      margin: 0 0 6px;
    }

    .card-address {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: #555;
      margin: 0 0 4px;
    }

    .card-phone {
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      color: #555;
      margin: 0 0 18px;
    }

    .call-btn {
      display: block;
      width: 100%;
      padding: 11px 0;
      border-radius: 10px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      font-weight: 800;
      text-align: center;
      cursor: pointer;
      border: none;
      letter-spacing: 0.3px;
      transition: opacity 0.15s, transform 0.15s;
    }

    .call-btn.pink-btn {
      background: #8B3A44;
      color: #fff;
    }

    .call-btn.yellow-btn {
      background: #F5C400;
      color: #3a2800;
    }

    .call-btn:hover {
      opacity: 0.88;
      transform: scale(0.98);
    }

    @media (max-width: 560px) {
      .cards-grid {
        grid-template-columns: 1fr;
      }
      .section-title {
        font-size: 26px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="find-us-badge">Find Us</div>
  <h2 class="section-title">Two Locations</h2>

  <div class="cards-grid">

    <!-- Nawala Branch -->
    <div class="loc-card pink-card">
      <div class="card-emoji">🌍</div>
      <p class="card-name">Nawala Branch</p>
      <p class="card-address">573, Nawala Road, Rajagiriya</p>
      <p class="card-phone">011 286 2656 · 077 360 3777</p>
      <button class="call-btn pink-btn">Call Now</button>
    </div>

    <!-- Mount Lavinia Branch -->
    <div class="loc-card yellow-card">
      <div class="card-emoji">📍</div>
      <p class="card-name">Mount Lavinia Branch</p>
      <p class="card-address">3rd Floor, Mount City Building, Galle Road</p>
      <p class="card-phone">011 588 2656 · 077 360 3777</p>
      <button class="call-btn yellow-btn">Call Now</button>
    </div>

  </div>
</div>
</body>
</html>
